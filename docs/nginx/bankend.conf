# Drop this snippet into the HTTPS server block for `xiaoxiao.cool`
# to proxy the tracking backend that listens on PORT=8004.
server {
    listen 443 ssl;
    server_name xiaoxiao.cool;

    # ... SSL config here (certificates, etc.) ...

    # Reverse proxy: https://xiaoxiao.cool/bankend -> http://127.0.0.1:8004
    location /bankend/ {
        proxy_pass http://127.0.0.1:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering on;
    }

    # Optional: redirect bare /bankend to the trailing slash form.
    location = /bankend {
        return 301 https://$host/bankend/;
    }
}
