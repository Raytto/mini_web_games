<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script src="scripts/i18n-messages.js?v=20260924b"></script>
    <script src="scripts/i18n.js?v=20260924e2"></script>
    <link rel="stylesheet" href="scripts/i18n.css?v=20260924b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>XIAOXIAO GAMES</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
            background: #222;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #music-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 24px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #music-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.4);
        }

        #music-toggle.off {
            opacity: 0.6;
            filter: grayscale(100%);
        }
    </style>
</head>

<body>
    <audio id="bgm" loop preload="none">
        <source src="upload/audio/bgm_piano.mp3" type="audio/mpeg">
    </audio>

    <div id="music-toggle" class="off" title="音乐开关">🎵</div>

    <!-- Load the original menu page -->
    <iframe id="content-frame" src="home.html" allow="autoplay"></iframe>

    <script>
        const bgm = document.getElementById('bgm');
        const toggleBtn = document.getElementById('music-toggle');
        const iframe = document.getElementById('content-frame');

        // BGM Configuration
        const HOME_BGM = 'upload/audio/bgm_piano.mp3';
        const GAME_BGMS = [
            'upload/audio/bgm_piano2.mp3',
            'upload/audio/bgm_piano3.mp3',
            'upload/audio/bgm_piano4.mp3'
        ];
        let unplayedGameBgms = [];
        let isPlaying = false;
        // Persist user toggle so navigation between games does not force music back on
        const MUSIC_PREF_KEY = 'bgmEnabled';
        let musicEnabled = true;
        let pageIsActive = !document.hidden;
        let resumeAfterPageReturn = false;
        let lessonMode = false;
        const ENGLISH_GAMES = new Set(["symmetry_draw", "little_drums", "little_piano", "draw_swim", "dino_dig", "animal_clinic", "living_stickers", "snip_picnic", "goodnight_hotel", "silly_hair_salon", "peekaboo_house", "jelly_colors", "hello_teddy", "duck_boat", "tickly_teddy", "little_detective"]);

        try {
            const storedPref = localStorage.getItem(MUSIC_PREF_KEY);
            if (storedPref !== null) {
                musicEnabled = storedPref === 'true';
            }
        } catch (e) {
            console.log('Cannot read music preference, defaulting to on');
        }

        // Prevent multiple BGM instances if this page is loaded inside an iframe
        if (window.self !== window.top) {
            if (bgm) {
                bgm.pause();
                bgm.remove();
            }
            if (toggleBtn) {
                toggleBtn.style.display = 'none';
            }
        }

        if (bgm) {
            // Keep the piano behind the English narration by default.
            bgm.volume = 0.04;
            bgm.autoplay = musicEnabled && pageIsActive && !lessonMode;
            if (!musicEnabled) {
                bgm.pause();
            }
        }

        function updateIcon() {
            if (!toggleBtn) return;
            if (musicEnabled) {
                toggleBtn.textContent = '🎵';
                toggleBtn.classList.remove('off');
                toggleBtn.style.animation = isPlaying ? 'pulse 2s infinite' : 'none';
            } else {
                toggleBtn.textContent = '🔇';
                toggleBtn.classList.add('off');
                toggleBtn.style.animation = 'none';
            }
        }

        function tryPlay() {
            if (!bgm || window.self !== window.top) return;
            if (lessonMode || !pageIsActive || document.hidden) {
                bgm.pause();
                isPlaying = false;
                updateIcon();
                return;
            }
            if (!musicEnabled) {
                isPlaying = false;
                updateIcon();
                return;
            }
            if (!bgm.paused) {
                isPlaying = true;
                updateIcon();
                return;
            }

            bgm.play().then(() => {
                if (lessonMode || !pageIsActive || document.hidden || !musicEnabled) {
                    bgm.pause();
                    isPlaying = false;
                    updateIcon();
                    return;
                }
                isPlaying = true;
                updateIcon();
                // Remove the global listeners if we succeed
                document.removeEventListener('click', tryPlay);
                document.removeEventListener('touchstart', tryPlay);
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                if (iframeDoc) {
                    iframeDoc.removeEventListener('click', tryPlay);
                    iframeDoc.removeEventListener('touchstart', tryPlay);
                }
            }).catch(e => {
                console.log("Autoplay prevented, waiting for interaction");
                isPlaying = false;
                updateIcon();
                document.addEventListener('click', tryPlay);
                document.addEventListener('touchstart', tryPlay);
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    iframeDoc.addEventListener('click', tryPlay);
                    iframeDoc.addEventListener('touchstart', tryPlay);
                } catch (frameError) {
                    // The next iframe load will attach the interaction listeners.
                }
            });
        }

        function pauseForPageInactivity() {
            if (!bgm || window.self !== window.top) return;
            resumeAfterPageReturn = resumeAfterPageReturn || (musicEnabled && (isPlaying || !bgm.paused));
            pageIsActive = false;
            bgm.autoplay = false;
            bgm.pause();
            isPlaying = false;
            updateIcon();
        }

        function resumeAfterPageActivity() {
            if (!bgm || window.self !== window.top || document.hidden) return;
            pageIsActive = true;
            bgm.autoplay = musicEnabled && !lessonMode;
            const shouldResume = resumeAfterPageReturn && musicEnabled;
            resumeAfterPageReturn = false;
            if (shouldResume) tryPlay();
            else updateIcon();
        }

        // Page Visibility covers background tabs, minimized browsers and OS lock
        // screens. pagehide/pageshow provide the Safari/iPad lifecycle fallback.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) pauseForPageInactivity();
            else resumeAfterPageActivity();
        });
        window.addEventListener('pagehide', pauseForPageInactivity);
        window.addEventListener('pageshow', resumeAfterPageActivity);
        document.addEventListener('freeze', pauseForPageInactivity);
        document.addEventListener('resume', resumeAfterPageActivity);

        // --- New BGM Logic ---

        function getNextGameTrack() {
            if (unplayedGameBgms.length === 0) {
                unplayedGameBgms = [...GAME_BGMS];
            }
            const randomIndex = Math.floor(Math.random() * unplayedGameBgms.length);
            return unplayedGameBgms.splice(randomIndex, 1)[0];
        }

        function playHomeBgm() {
            if (bgm.getAttribute('data-mode') === 'home') return;

            // If checking absolute path is tricky, triggering based on mode switch is safer 
            // provided we handle the initial load correctly.

            bgm.setAttribute('data-mode', 'home');
            bgm.onended = null;
            bgm.loop = true;

            // Avoid reloading if already correct (e.g. initial load)
            if (!bgm.src.endsWith(HOME_BGM)) {
                bgm.src = HOME_BGM;
                if (isPlaying) bgm.play().catch(console.error);
            }
        }

        function playGameBgm() {
            if (bgm.getAttribute('data-mode') === 'game') return;

            bgm.setAttribute('data-mode', 'game');
            bgm.loop = false;

            const playNext = () => {
                // Ensure we are still in game mode (in case user switched to home while waiting)
                if (bgm.getAttribute('data-mode') !== 'game') return;

                const track = getNextGameTrack();
                bgm.src = track;
                if (isPlaying) bgm.play().catch(console.error);
            };

            bgm.onended = playNext;
            playNext();
        }

        function enterLessonMode() {
            lessonMode = true;
            bgm.autoplay = false;
            bgm.pause();
            isPlaying = false;
            bgm.onended = null;
            bgm.setAttribute('data-mode', 'lesson');
            // Release an in-flight media request before iframe navigation.
            // Restoring home/game music assigns its normal source again.
            bgm.removeAttribute('src');
            bgm.querySelectorAll('source').forEach(source => source.remove());
            bgm.load();
            toggleBtn.style.display = 'none';
            updateIcon();
        }

        // Unlock in the game-card click itself, before the iframe navigates.
        // The new game borrows this context so touch browsers need no second tap.
        let peekabooContext = null, speechGameId = null;
        window.gameSpeechContext = id => id === speechGameId ? peekabooContext : null;
        window.peekabooAudioContext = () => peekabooContext;
        function preparePeekabooAudio(id) {
            if (speechGameId !== id) releasePeekabooAudio();
            speechGameId = id;
            try {
                const Audio = window.AudioContext || window.webkitAudioContext;
                if (!Audio) return;
                if (!peekabooContext || peekabooContext.state === 'closed') {
                    peekabooContext = new Audio();
                }
                void peekabooContext.resume().catch(() => {});
            } catch { /* The game retains its normal sound controls. */ }
        }
        function releasePeekabooAudio() {
            const previous = peekabooContext;
            peekabooContext = null; speechGameId = null;
            if (previous && previous.state !== 'closed') void previous.close().catch(() => {});
        }

        function checkGameState() {
            try {
                const href = iframe.contentWindow.location.href;
                const wasLesson = lessonMode;
                const gameId = new URL(href).pathname.match(/\/games\/([^/]+)\//)?.[1];
                if (gameId !== speechGameId) releasePeekabooAudio();
                lessonMode = ENGLISH_GAMES.has(gameId);
                toggleBtn.style.display = lessonMode ? 'none' : 'flex';
                if (lessonMode) {
                    enterLessonMode();
                    return;
                }
                // Determine mode based on URL
                if (href.includes('home.html') || href.endsWith('/')) {
                    playHomeBgm();
                } else {
                    playGameBgm();
                }

                // Attach interaction listeners to new frame content
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.addEventListener('click', event => {
                    const link = event.target.closest?.('a[href]');
                    if (!link) return;
                    const destination = new URL(link.href, iframeDoc.baseURI);
                    const id = destination.pathname.match(/\/games\/([^/]+)\//)?.[1];
                    if (destination.origin === location.origin && id &&
                        event.button === 0 && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey &&
                        (!link.target || link.target === '_self')) {
                        preparePeekabooAudio(id);
                        // Pause the old media before entering a lesson.
                        if (ENGLISH_GAMES.has(id)) enterLessonMode();
                    }
                }, { capture: true });
                iframeDoc.addEventListener('click', tryPlay);
                iframeDoc.addEventListener('touchstart', tryPlay);
                if (wasLesson && musicEnabled) tryPlay();
            } catch (e) {
                console.log("Cannot access iframe content");
            }
        }

        // Initialize state
        // Set initial mode to 'home' implicitly matching the HTML defaults
        if (bgm.src.endsWith(HOME_BGM)) {
            bgm.setAttribute('data-mode', 'home');
        }

        updateIcon();

        // Defer the audio request until the first user interaction so it does
        // not compete with the visible game-card artwork on initial load.
        document.addEventListener('click', tryPlay);
        document.addEventListener('touchstart', tryPlay);

        if (toggleBtn) {
            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                musicEnabled = !musicEnabled;
                bgm.autoplay = musicEnabled && pageIsActive && !lessonMode;
                try {
                    localStorage.setItem(MUSIC_PREF_KEY, musicEnabled);
                } catch (err) {
                    console.log('Cannot store music preference');
                }

                if (!musicEnabled) {
                    if (bgm) bgm.pause();
                    resumeAfterPageReturn = false;
                    isPlaying = false;
                    updateIcon();
                    return;
                }

                tryPlay();
                updateIcon();
            });
        }

        // Monitor Iframe Navigation
        iframe.onload = checkGameState;

        // Add pulse animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.1); }
                100% { transform: scale(1); }
            }
        `;
        document.head.appendChild(style);

        // Register Service Worker for caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
    <script src="scripts/bankend-config.js?v=2"></script>
    <script src="scripts/tracking.js?v=2"></script>
</body>

</html>
