<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#dff8ef">
    <title>喂猫猫</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css?v=20260720b">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
</head>
<body>
    <div class="game-shell">
        <header class="topbar">
            <a class="round-btn back-btn-v2" href="../../home.html" aria-label="返回游戏列表">←</a>
            <div class="title-wrap">
                <h1>喂猫猫</h1>
                <p id="helperText">把好吃的送给猫猫</p>
            </div>
            <button class="round-btn reset-btn" id="resetButton" type="button" aria-label="重新开始">↻</button>
        </header>

        <main class="scene" id="scene">
            <div class="status-pill" id="statusText" role="status" aria-live="polite">猫猫肚子饿啦！</div>
            <div class="meal-progress" id="mealProgress" aria-label="猫猫吃饱进度"></div>

            <button class="cat-target" id="catTarget" type="button" data-drop-zone="cat" aria-label="把食物喂给猫猫">
                <img id="catImage" src="assets/cat_waiting.webp" alt="等待吃饭的橘猫">
                <span class="cat-glow" aria-hidden="true"></span>
                <span class="sparkles" id="sparkles" aria-hidden="true"></span>
            </button>

            <div class="bowl-wrap" id="bowlTarget" data-drop-zone="cat" aria-label="猫猫的饭碗">
                <img class="bowl-image" src="assets/cat_bowl.webp" alt="猫猫的饭碗">
                <img class="bowl-food" id="bowlFood" alt="">
            </div>

            <button class="basket-target" id="basketTarget" type="button" data-drop-zone="basket" aria-label="把猫猫不吃的食物放进小篮子">
                <span class="basket-label">不吃的放这里</span>
                <img src="assets/sorting_basket.webp" alt="小篮子">
            </button>
        </main>

        <section class="food-dock" id="foodDock" aria-label="待选择的食物">
            <div class="food-list" id="foodList"></div>
            <div class="round-finish" id="roundFinish" hidden>
                <div>
                    <strong>猫猫吃饱啦！</strong>
                    <span>谢谢你照顾它</span>
                </div>
                <button id="nextRoundButton" type="button">再喂一轮</button>
            </div>
            <p class="play-hint">拖一拖，或先点食物再点猫猫</p>
        </section>
    </div>

    <template id="foodTemplate">
        <button class="food-card" type="button">
            <img alt="">
            <span></span>
        </button>
    </template>

    <script>window.MINI_GAME = { id: "feed_animal", name: "喂猫猫" };</script>
    <script src="../../scripts/bankend-config.js?v=2"></script>
    <script src="../../scripts/tracking.js?v=2"></script>
    <script src="game.js?v=20260720b"></script>
</body>
</html>
