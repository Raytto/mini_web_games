<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Feed the Cat</title>
    <style>
        @font-face {
            font-family: 'Fredoka One';
            src: local('Fredoka One'), local('Verdana'), sans-serif;
        }

        #gameCanvas {
            cursor: pointer;
            /* touch-action: none is critical for dragging on mobile */
            touch-action: none;
        }
    </style>
    <link rel="stylesheet" href="../../style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <a href="../../home.html" class="back-btn">⬅</a>
            <!-- We don't really need a score for this game, it's open ended play. Maybe just a reaction text? -->
            <div id="reaction-text"
                style="position: absolute; top: 20%; left: 75%; transform: translateX(-50%); font-size: 40px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); display: none; pointer-events: none; font-family: 'Fredoka One';">
                YUMMY!
            </div>


        </div>
    </div>
    <script>
        window.MINI_GAME = { id: "feed_animal", name: "Feed the Cat" };
    </script>
    <script src="../../scripts/bankend-config.js?v=2"></script>
    <script src="../../scripts/tracking.js?v=2"></script>
    <script src="game.js"></script>
</body>

</html>
