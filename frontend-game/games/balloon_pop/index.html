<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script defer src="../../scripts/i18n-messages.js?v=20260924b"></script>
    <script defer src="../../scripts/i18n.js?v=20260924e2"></script>
    <link rel="stylesheet" href="../../scripts/i18n.css?v=20260924b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>戳气球</title>
    <style>
        /* Custom balloon cursor or just pointer */
        #gameCanvas {
            cursor: pointer;
        }

        #game-container {
            background-color: #87CEEB;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
        }

        #resource-loader {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        #resource-loader.hidden { display: none; }
        #resource-loader::before {
            content: ''; width: 14px; height: 14px;
            border: 2px solid #ffffff60; border-top-color: white;
            border-radius: 50%; animation: loading-turn 1s linear infinite;
        }
        #resource-loader.failed::before { display: none; }
        #retry-game { pointer-events: auto; padding: 8px 12px; border: 0; border-radius: 12px; }
        @keyframes loading-turn { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #resource-loader::before { animation: none; } }
    </style>
    <link rel="stylesheet" href="../../style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
    <link rel="stylesheet" href="../shared/game-voice.css?v=20260930gv1">
    <link rel="stylesheet" href="../shared/arcade-feedback.css?v=20260930combo1">
<link rel="stylesheet" href="../../scripts/game-home.css?v=20261002home1">
<script defer src="../../scripts/game-home.js?v=20261003home2"></script>
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <a href="../../home.html" class="back-btn" aria-label="返回游戏首页">⬅</a>
            <div id="score-board">
                <span class="score-icon">🎈</span>
                <span id="score">0</span>
            </div>

            <div id="resource-loader" role="status" data-i18n-ignore lang="en">
                <span id="loading-message">Getting ready…</span>
                <button id="retry-game" type="button" hidden onclick="location.reload()">Try again</button>
            </div>

            <div id="game-over-screen" class="hidden">
                <h1>真棒！</h1>
                <p>分数：<span id="final-score">0</span></p>
                <button id="restart-btn">再来</button>
            </div>
        </div>
    </div>
    <script>
        window.MINI_GAME = { id: "balloon_pop", name: "Balloon Pop" };
    </script>
    <!-- Start play before optional narration, translation and analytics finish loading. -->
    <script src="../shared/arcade-feedback.js?v=20260930combo1"></script>
    <script src="game.js?v=20261001short1" onerror="document.getElementById('resource-loader').classList.add('failed'); document.getElementById('loading-message').textContent='Could not start.'; document.getElementById('retry-game').hidden=false;"></script>
    <script defer src="../shared/voice-catalog.js?v=20261017warm1"></script>
    <script defer src="../shared/game-voice.js?v=20260930lf1"></script>
    <script defer src="../../scripts/bankend-config.js?v=2"></script>
    <script defer src="../../scripts/tracking.js?v=2"></script>
</body>

</html>
