<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script src="../../scripts/i18n-messages.js?v=20260924b"></script>
    <script src="../../scripts/i18n.js?v=20260924e2"></script>
    <link rel="stylesheet" href="../../scripts/i18n.css?v=20260924b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天气魔法</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/game-voice.css?v=20260930gv1">
<link rel="stylesheet" href="../../scripts/game-home.css?v=20261002home1">
<script defer src="../../scripts/game-home.js?v=20261003home2"></script>
</head>

<body>
    <div id="game-container">
        <a href="../../home.html" class="back-btn" aria-label="返回游戏首页">⬅</a>

        <!-- The Scene Container will handle the background image switching via CSS classes -->
        <div id="scene" class="sunny">

            <!-- Sun Element (Visible in Sunny/Rainbow) -->
            <img src="assets/sun.png" id="sun-element" class="interactive" alt="Sun">

            <!-- Rainbow Element (Visible in Rainbow) -->
            <div id="rainbow-element" class="interactive"></div>

            <!-- Weather Particles -->
            <div class="weather-container" id="rain-container"></div>
            <div class="weather-container" id="snow-container"></div>

            <!-- UI Text -->
            <div id="overlay-text">晴天</div>
            <div id="hint-text">点一下，或上下划</div>
        </div>
    </div>

    <!-- Audio Placeholders -->
    <script>
        window.MINI_GAME = { id: "time_magic", name: "Time Magic" };
    </script>
    <script src="../../scripts/bankend-config.js?v=2"></script>
    <script src="../../scripts/tracking.js?v=2"></script>
    <script src="../shared/voice-catalog.js?v=20261017warm1"></script>
    <script src="../shared/game-voice.js?v=20260930lf1"></script>
    <script src="game.js?v=20260930lf1"></script>
</body>

</html>
