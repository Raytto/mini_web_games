<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script src="../../scripts/i18n-messages.js?v=20260924b"></script>
    <script src="../../scripts/i18n.js?v=20260924e2"></script>
    <link rel="stylesheet" href="../../scripts/i18n.css?v=20260924b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>收玩具</title>
    <link rel="stylesheet" href="style.css?v=20260720-1">
    <link rel="stylesheet" href="../shared/game-voice.css?v=20260930gv1">
<link rel="stylesheet" href="../../scripts/game-home.css?v=20261002home1">
<script defer src="../../scripts/game-home.js?v=20261003home2"></script>
</head>

<body>
    <div id="game-container">
        <a id="back-button" href="../../home.html" aria-label="返回游戏首页">⬅</a>

        <div id="game-area">
            <div id="box-zone">
                <img id="box-img" src="assets/box_open_clean.png" alt="打开的玩具箱" draggable="false">
            </div>
            <div id="toys-layer">
                <!-- Toys will be spawned here -->
            </div>
        </div>

        <div id="win-overlay" class="hidden" aria-live="polite">
            <div class="win-content">
                <div class="stars">⭐⭐⭐</div>
                <div class="win-copy"><h1>收好啦！</h1><p>玩具箱变整齐啦</p></div>
                <button id="again-button" type="button">再收一次</button>
            </div>
        </div>
    </div>

    <script>
        window.MINI_GAME = { id: "tidy_up", name: "Tidy Up" };
    </script>
    <script src="../../scripts/bankend-config.js?v=2"></script>
    <script src="../../scripts/tracking.js?v=2"></script>
    <script src="../shared/voice-catalog.js?v=20260930lf1"></script>
    <script src="../shared/game-voice.js?v=20260930lf1"></script>
    <script src="script.js?v=20260930lf1"></script>
</body>

</html>
