<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script src="../../scripts/i18n-messages.js?v=20260924b"></script>
    <script src="../../scripts/i18n.js?v=20260924e2"></script>
    <link rel="stylesheet" href="../../scripts/i18n.css?v=20260924b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>小火车装货</title>
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="stylesheet" href="../shared/game-voice.css?v=20260930gv1">
<link rel="stylesheet" href="../../scripts/game-home.css?v=20261002home1">
<script defer src="../../scripts/game-home.js?v=20261003home2"></script>
</head>

<body>
    <div id="game" class="cargo-game">
        <img class="scene-background" src="../shared/generated_assets/train_cargo_bg_v2_preview.webp" data-full-src="../shared/generated_assets/train_cargo_bg_v2_optimized.webp" alt="阳光下的火车站空站台" draggable="false">

        <header class="game-header">
            <a class="round-btn" href="../../home.html" aria-label="返回游戏首页">←</a>
            <div class="title-wrap">
                <h1>小火车装货</h1>
                <p id="hint" aria-live="polite">按颜色把玩具装进车厢</p>
            </div>
            <button id="reset-btn" class="round-btn" type="button" aria-label="重新装这一列火车">↻</button>
        </header>

        <div class="status-row" aria-live="polite">
            <span id="round-badge">第 1 列</span>
            <span id="collection-badge">玩具图鉴 0/12</span>
        </div>

        <main class="play-area">
            <section id="train-stage" class="train-stage entering" aria-label="等待装货的小火车">
                <div class="steam-cloud" aria-hidden="true"><i></i><i></i><i></i></div>
                <div id="train" class="train"></div>
                <div class="speed-lines" aria-hidden="true"></div>
            </section>

            <section id="toy-dock" class="toy-dock" aria-label="待装车的玩具">
                <div class="dock-title"><span aria-hidden="true">🧸</span> 待装玩具</div>
                <div id="toy-row" class="toy-row"></div>
            </section>
        </main>

        <div id="travel-message" class="travel-message" aria-live="polite" hidden>
            <span aria-hidden="true">🚂</span>
            <b>装满啦，出发！</b>
        </div>
    </div>

    <script>window.MINI_GAME = { id: "train_cargo", name: "小火车装货" };</script>
    <script src="../../scripts/bankend-config.js?v=2"></script>
    <script src="../../scripts/tracking.js?v=2"></script>
    <script src="../shared/progressive-images.js?v=2"></script>
    <script src="../shared/game_juice.js?v=1"></script>
    <script src="../shared/voice-catalog.js?v=20261017warm1"></script>
    <script src="../shared/game-voice.js?v=20260930lf1"></script>
    <script src="game.js?v=20260930lf1"></script>
</body>

</html>
