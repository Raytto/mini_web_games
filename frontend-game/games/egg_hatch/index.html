<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script src="../../scripts/i18n-messages.js?v=20260924b"></script>
    <script src="../../scripts/i18n.js?v=20260924e2"></script>
    <link rel="stylesheet" href="../../scripts/i18n.css?v=20260924b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>孵小蛋</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css?v=20260930egg1">
    <link rel="stylesheet" href="../shared/game-voice.css?v=20260930gv1">
<link rel="stylesheet" href="../../scripts/game-home.css?v=20261002home1">
<script defer src="../../scripts/game-home.js?v=20261003home2"></script>
</head>

<body>
    <div id="game-container">
        <img class="scene-background" src="assets/egg-hatch-bg-v2-preview.webp"
            data-full-src="assets/egg-hatch-bg-v2-optimized.webp" alt="阳光森林里的温暖孵化草地" draggable="false">

        <a href="../../home.html" class="back-btn" aria-label="返回游戏首页">⬅</a>

        <div id="collection-badge" aria-live="polite">动物图鉴 0/50</div>

        <div id="warmth-meter" aria-hidden="true">
            <span>暖暖</span>
            <div id="meter-track">
                <div id="meter-fill"></div>
            </div>
        </div>

        <div id="stage">
            <div id="nest">
                <img class="nest-visual nest-back" src="assets/egg-hatch-nest-v2-optimized.webp" alt="" aria-hidden="true" draggable="false">
                <button id="egg-button" class="needs-guide" type="button" aria-label="点一点孵小蛋">
                    <span id="egg">🥚</span>
                    <span id="crack-line"></span>
                </button>
                <img class="nest-visual nest-front" src="assets/egg-hatch-nest-v2-optimized.webp" alt="" aria-hidden="true" draggable="false">
            </div>

            <div id="baby" class="hidden" aria-live="polite"></div>
        </div>

        <div id="game-footer">
            <div id="hint">点一点敲一敲，也可以拖着摸摸</div>
            <div id="result-copy" class="hidden" aria-live="polite">
                <div id="result-title">
                    <strong id="baby-name"></strong>
                    <span id="baby-rarity"></span>
                </div>
                <div id="baby-line"></div>
            </div>
            <button id="again-btn" class="hidden" type="button">再孵一颗</button>
        </div>

        <div id="confetti-layer" aria-hidden="true"></div>
    </div>

    <script>
        window.MINI_GAME = { id: "egg_hatch", name: "Egg Hatch" };
    </script>
    <script src="../../scripts/bankend-config.js?v=2"></script>
    <script src="../../scripts/tracking.js?v=2"></script>
    <script src="../shared/progressive-images.js?v=2"></script>
    <script src="../shared/game_juice.js?v=1"></script>
    <script src="../shared/voice-catalog.js?v=20261017warm1"></script>
    <script src="../shared/game-voice.js?v=20260930lf1"></script>
    <script src="script.js?v=20260930lf1"></script>
</body>

</html>
