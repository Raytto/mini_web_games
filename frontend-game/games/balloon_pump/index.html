<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script src="../../scripts/i18n-messages.js?v=20260924b"></script>
    <script src="../../scripts/i18n.js?v=20260924e2"></script>
    <link rel="stylesheet" href="../../scripts/i18n.css?v=20260924b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打气球</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../shared/game-voice.css?v=20260930gv1">
<link rel="stylesheet" href="../../scripts/game-home.css?v=20261002home1">
<script defer src="../../scripts/game-home.js?v=20261003home2"></script>
</head>

<body>
    <div id="game-container">
        <!-- Back Button -->
        <a href="../../home.html" class="back-btn" aria-label="返回游戏首页">
            <svg viewBox="0 0 24 24" fill="none" class="arrow-icon">
                <path d="M20 12H4M4 12L10 18M4 12L10 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </a>

        <!-- Game Area -->
        <div id="scene">
            <div id="confetti-container"></div>

            <div id="balloon-anchor">
                <div id="balloon">
                    <div class="reflection"></div>
                    <div class="knot"></div>
                    <div class="string"></div>
                </div>
            </div>

            <div id="pump-container">
                <div id="pump-handle">
                    <div class="handle-bar"></div>
                    <div class="handle-stem"></div>
                </div>
                <div id="pump-body">
                    <div class="pump-hose"></div>
                </div>
                <div id="pump-base"></div>
            </div>

            <div id="instruction-text">按住给气球打气</div>
        </div>
    </div>

    <script>
        window.MINI_GAME = { id: "balloon_pump", name: "Balloon Pump" };
    </script>
    <script src="../../scripts/bankend-config.js?v=2"></script>
    <script src="../../scripts/tracking.js?v=2"></script>
    <script src="../shared/voice-catalog.js?v=20260930lf1"></script>
    <script src="voice-catalog.js?v=20261014pump1"></script>
    <script src="../shared/game-voice.js?v=20260930lf1"></script>
    <script src="script.js?v=20261014pump1"></script>
</body>

</html>
