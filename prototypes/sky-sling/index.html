bubbles=bubbles.filter(b=>!b.dead&&b.x+b.r>-50);shots=shots.filter(p=>!p.dead);for(const p of particles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;}particles=particles.filter(p=>p.age<p.life).slice(-420);for(const r of rings)r.age+=dt;rings=rings.filter(r=>r.age<r.max).slice(-55);for(const l of labels)l.age+=dt;labels=labels.filter(l=>l.age<l.life).slice(-35);if(time>celebrateUntil)$('#celebration').classList.remove('on');if(firstShot&&time>hintUntil)$('#hint').classList.add('fade');}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=fill;ctx.fill();}
function line(x1,y1,x2,y2,color,width){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();}
function cloud(x,y,size,opacity=1){ctx.save();ctx.translate(x,y);ctx.scale(size,size);ctx.globalAlpha=opacity;ctx.fillStyle='#fffef5';ctx.beginPath();ctx.moveTo(-67,13);ctx.bezierCurveTo(-95,4,-78,-24,-57,-23);ctx.bezierCurveTo(-56,-53,-15,-57,-5,-30);ctx.bezierCurveTo(14,-53,51,-31,48,-10);ctx.bezierCurveTo(84,-19,93,17,64,22);ctx.bezierCurveTo(28,29,-40,28,-67,13);ctx.fill();ctx.restore();}

function background(){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#a8dce9');grad.addColorStop(.52,'#d0edf0');grad.addColorStop(1,'#f6f2d9');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

function drawBubble(b){ctx.save();ctx.translate(b.x,b.y);const wob=reduced?1:Math.sin(time*1.5+b.a)*.026+1;ctx.scale(wob,2-wob);const g=ctx.createRadialGradient(-b.r*.3,-b.r*.35,b.r*.05,0,0,b.r);g.addColorStop(0,'#ffffff5c');g.addColorStop(.5,`hsla(${b.hue} 80% 86% / .10)`);g.addColorStop(.81,`hsla(${b.hue} 75% 80% / .20)`);g.addColorStop(.94,`hsla(${b.hue} 62% 73% / .64)`);g.addColorStop(1,`hsla(${(b.hue+50)%360} 66% 86% / .9)`);ctx.beginPath();ctx.arc(0,0,b.r,0,TAU);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#ffffffa8';ctx.lineWidth=1.6;ctx.stroke();ctx.beginPath();ctx.arc(0,0,b.r*.9,.2,1.9);ctx.strokeStyle=`hsla(${(b.hue+110)%360} 70% 82% / .9)`;ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(0,0,b.r*.77,3.5,4.35);ctx.strokeStyle='#fffffff0';ctx.lineWidth=Math.max(2,b.r*.065);ctx.lineCap='round';ctx.stroke();ellipse(-b.r*.36,-b.r*.57,b.r*.07,b.r*.035,'#ffffffb8');ellipse(b.r*.4,b.r*.55,b.r*.07,b.r*.035,'#ffffffbc');ctx.restore();}
function drawAmmo(type,x,y,r,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(r/28,r/28);const cfg=TYPES[type];ctx.lineWidth=1.8;ctx.lineJoin='round';if(type==='sun'){ctx.beginPath();for(let i=0;i<32;i++){const a=i*TAU/32,rr=i%4<2?30:23;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fillStyle=cfg.color;ctx.fill();ctx.strokeStyle='#dba849';ctx.stroke();ellipse(0,0,19,19,'#ffe7a0');}else if(type==='feather'){ctx.rotate(.7);ctx.beginPath();ctx.moveTo(-22,23);ctx.bezierCurveTo(-31,-9,-7,-27,24,-27);ctx.bezierCurveTo(31,9,6,22,-22,23);ctx.fillStyle=cfg.color;ctx.fill();ctx.strokeStyle='#65b5a4';ctx.stroke();line(-24,26,20,-22,'#519e92',2.4);line(-13,14,-14,-1,'#68b7a7',1.7);line(-3,3,13,3,'#68b7a7',1.7);ctx.restore();return;}else if(type==='moon'){ellipse(0,0,28,28,cfg.color);ctx.beginPath();ctx.arc(0,0,28,0,TAU);ctx.strokeStyle='#a294c9';ctx.stroke();ellipse(-13,-10,6,7,'#aaa5d5');ellipse(13,13,5,4,'#aaa5d5');ellipse(12,-16,3,3,'#dcd7f3');}else{const colors=['#f4a8ba','#ffd681','#b7dbab','#9dd9e9','#c7b3e6'];for(let i=0;i<5;i++){ctx.save();ctx.rotate(TAU*i/5);ellipse(0,-17,11,14,colors[i]);ctx.restore();}ellipse(0,0,12,12,'#ffefa9');}ctx.rotate(-rot);const face=type==='flower'?.65:1;ctx.scale(face,face);line(-6,-3,-6,0,type==='moon'?'#73688e':'#99764f',2.4);line(6,-3,6,0,type==='moon'?'#73688e':'#99764f',2.4);ctx.beginPath();ctx.moveTo(-4,6);ctx.quadraticCurveTo(0,10,4,6);ctx.strokeStyle=type==='moon'?'#73688e':'#99764f';ctx.lineWidth=2;ctx.stroke();ctx.restore();}
function bunny(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(time*.9)*.012);ellipse(0,2,27,12,'#89ac9730');ellipse(0,-17,24,27,'#fffbec');ellipse(-11,-62,8,25,'#fffbec');ellipse(11,-62,8,25,'#fffbec');ellipse(-11,-63,3,16,'#efb8b0');ellipse(11,-63,3,16,'#efb8b0');ellipse(0,-40,25,21,'#fffbec');ellipse(-9,-41,2,3,'#6d6a61');ellipse(9,-41,2,3,'#6d6a61');ellipse(-16,-34,5,3,'#f3c4bc');ellipse(16,-34,5,3,'#f3c4bc');ctx.beginPath();ctx.moveTo(-3,-35);ctx.lineTo(3,-35);ctx.lineTo(0,-32);ctx.fillStyle='#ce9d98';ctx.fill();ctx.beginPath();ctx.moveTo(-20,-21);ctx.quadraticCurveTo(0,-11,20,-21);ctx.lineTo(17,-14);ctx.quadraticCurveTo(0,-4,-17,-14);ctx.fillStyle='#7fb9ae';ctx.fill();ellipse(-19,-16,7,10,'#fffbec');ellipse(19,-16,7,10,'#fffbec');ctx.restore();}
function launcher(back){const x=A.x,y=A.y,point=drag?dragVector(drag):kbActive?{dx:-Math.cos(kbAngle)*kbPower*104,dy:-Math.sin(kbAngle)*kbPower*104}:{dx:0,dy:0};const px=x+point.dx,py=y+point.dy;if(back){cloud(x-14,y+117,1.12,1);ellipse(x-10,y+140,79,9,'#8aada721');bunny(x-69,y+115);line(x+6,y+114,x+6,y+43,'#b27d57',20);line(x+6,y+51,x+28,y-6,'#b27d57',17);line(x+6,y+48,x-27,y-4,'#cb986a',20);line(x+3,y+111,x+3,y+49,'#e7b78a',5);line(x-27,y-4,px,py,'#957180',7);line(x+28,y-6,px,py,'#a58494',6);}else{line(x-27,y-4,px,py,'#896c80',7);ellipse(x-27,y-4,9,7,'#d7a579');if(reload<=0)drawAmmo(selected,px,py,TYPES[selected].r,drag?-point.dy*.007:Math.sin(time*1.2)*.08);if((drag||kbActive)&&reload<=0){const power=drag?dragVector(drag).power:kbPower;ctx.beginPath();ctx.arc(x,y,48,-Math.PI*.65,-Math.PI*.65+power*Math.PI*1.3);ctx.lineWidth=5;ctx.strokeStyle=power>.85?'#dcaf4b':'#80b5a7';ctx.lineCap='round';ctx.stroke();}}}
function drawTrajectory(plan){if(!plan)return;ctx.save();for(let i=1;i<33;i++){const t=i*.049,x=plan.x+plan.vx*t,y=plan.y+plan.vy*t+.5*plan.g*t*t;if(x>W+10||y>ground+15||y<10)break;const alpha=(1-i/37)*.68;ellipse(x,y,i%4===0?3.2:2.5,i%4===0?3.2:2.5,`rgba(66,108,125,${alpha})`);}ctx.restore();}

function render(){ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);background();for(const b of bubbles)drawBubble(b);launcher(true);if(drag)drawTrajectory(dragPlan(drag));else if(kbActive)drawTrajectory(keyboardPlan());for(const p of shots){for(let i=0;i<p.trail.length;i++){const q=p.trail[i];ellipse(q.x,q.y,(i+1)/p.trail.length*p.r*.32,(i+1)/p.trail.length*p.r*.32,TYPES[p.type].trail+'55');}drawAmmo(p.type,p.x,p.y,p.r,p.rot);}

for(const p of particles){ctx.save();ctx.globalAlpha=Math.max(0,1-p.age/p.life);if(p.star)star(p.x,p.y,p.r*1.5,p.color,p.age*2);else ellipse(p.x,p.y,p.r,p.r,p.color);ctx.restore();}launcher(false);for(const l of labels){ctx.save();ctx.globalAlpha=Math.max(0,1-l.age/l.life);ctx.font=`800 ${l.large?26:18}px ui-rounded,system-ui,sans-serif`;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff9';ctx.strokeText(l.text,l.x,l.y-l.age*45);ctx.fillStyle=l.large?'#b06d98':'#598d99';ctx.fillText(l.text,l.x,l.y-l.age*45);ctx.restore();}tutorial();}
