<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Magic</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <a href="../../home.html" class="back-btn">⬅</a>

        <!-- The Scene Container will handle the background image switching via CSS classes -->
        <div id="scene" class="sunny">

            <!-- Sun Element (Visible in Sunny/Rainbow) -->
            <img src="assets/sun.png" id="sun-element" class="interactive" alt="Sun">

            <!-- Rainbow Element (Visible in Rainbow) -->
            <div id="rainbow-element" class="interactive"></div>

            <!-- Weather Particles -->
            <div class="weather-container" id="rain-container"></div>
            <div class="weather-container" id="snow-container"></div>

            <!-- UI Text -->
            <div id="overlay-text">Sunny</div>
            <div id="hint-text">Swipe Up/Down</div>
        </div>
    </div>

    <!-- Audio Placeholders -->
    <script>
        window.MINI_GAME = { id: "time_magic", name: "Time Magic" };
    </script>
    <script src="../../scripts/bankend-config.js"></script>
    <script src="../../scripts/tracking.js"></script>
    <script src="game.js?v=2"></script>
</body>

</html>
