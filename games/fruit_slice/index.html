<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fruit Slice for Kids!</title>
    <style>
        /* Fallback font definition directly in head to avoid request */
        @font-face {
            font-family: 'Fredoka One';
            src: local('Fredoka One'), local('Verdana'), sans-serif;
            /* We'll use system fonts that look roundish */
        }

        #game-container {
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
        }
    </style>
    <link rel="stylesheet" href="../../style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍉</text></svg>">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <a href="../../index.html" class="back-btn">⬅</a>
            <div id="score-board">
                <span class="score-icon">🍎</span>
                <span id="score">0</span>
            </div>
            <div id="start-screen">
                <h1>Fruit Slice!</h1>
                <p>Move your mouse to slice frames!</p>
                <button id="start-btn">PLAY</button>
            </div>
            <div id="game-over-screen" class="hidden">
                <h1>Great Job!</h1>
                <p>Score: <span id="final-score">0</span></p>
                <button id="restart-btn">PLAY AGAIN</button>
            </div>
        </div>
    </div>
    <script src="game.js?v=1"></script>
</body>

</html>
